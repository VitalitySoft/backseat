{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{{ 'Create account' if mode == 'register' else 'Welcome back' }}</h1><form method="post" class="form">{% if mode == 'register' %}<label>Name<input name="name" required></label><label>Phone<input name="phone"></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="button">{{ 'Register' if mode == 'register' else 'Log in' }}</button></form></section>{% endblock %}
