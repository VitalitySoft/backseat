{% extends "backseat/base.html" %}{% block content %}<section class="panel"><h1>{{ ride.start_location }} to {{ ride.destination }}</h1><p>{{ ride.notes|default:"No notes provided." }}</p><p>Rider: <a href="{% url 'rider_profile' ride.rider.id %}">{{ ride.rider.user_profile.user.get_full_name }}</a></p><form method="post">{% csrf_token %}<button class="button">Request this ride</button></form></section>{% endblock %}
