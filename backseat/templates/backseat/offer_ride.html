{% extends "backseat/base.html" %}{% block content %}<section class="panel narrow"><h1>Offer a ride</h1><form method="post" class="form">{% csrf_token %}<label>Vehicle type<select name="vehicle_type"><option>FOUR_WHEELER</option><option>TWO_WHEELER</option></select></label><label>Make<input name="vehicle_make" required></label><label>Model<input name="vehicle_model" required></label><label>Plate<input name="vehicle_plate" required></label><label>Seats<input type="number" name="seats_available" min="1" value="1"></label><label>Start<input name="start_location" required></label><label>Destination<input name="destination" required></label><label>Notes<textarea name="notes"></textarea></label><button class="button">Publish ride</button></form></section>{% endblock %}
