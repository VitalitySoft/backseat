{% extends "backseat/base.html" %}{% block content %}<section class="panel"><h1>Admin</h1><div class="grid four"><article><b>{{ stats.users }}</b><span>Users</span></article><article><b>{{ stats.riders }}</b><span>Riders</span></article><article><b>{{ stats.rides }}</b><span>Rides</span></article><article><b>{{ stats.donations }}</b><span>Donations</span></article></div></section><section class="panel"><h2>Users</h2><table><tr><th>Name</th><th>Email</th><th>Role</th></tr>{% for u in users %}<tr><td>{{ u.user.get_full_name }}</td><td>{{ u.user.email }}</td><td>{{ u.role }}</td></tr>{% endfor %}</table></section>{% endblock %}
